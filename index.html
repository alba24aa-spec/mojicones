<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Diario digestivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#faf8f5;--fg:#1f2328;--mut:#6b7280;--card:#fff;--bd:#e3ded6;--ac:#2f6f5e;--acf:#fff;--sel:#dff0ea;--bad:#b42318;--st:#8a5a3c}
@media (prefers-color-scheme:dark){:root{--bg:#15181a;--fg:#e8e6e1;--mut:#9aa0a6;--card:#1e2224;--bd:#32373a;--ac:#5fb59f;--acf:#10201b;--sel:#1f3a32;--bad:#f2877d;--st:#b98562}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:12px 14px 80px}h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.sel{background:var(--sel);border-color:var(--ac)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}textarea{width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bt{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12.5px;padding:8px 6px}.bt b{font-size:16px}.bt svg.s{width:64px;height:40px;fill:var(--st)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}.row label{display:flex;gap:5px;align-items:center}
.mut{color:var(--mut);font-size:13px}.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}.li button{padding:3px 9px}
.chip{display:inline-block;background:var(--sel);border-radius:99px;padding:1px 8px;font-size:12px;margin:1px}
.alert{border-left:4px solid var(--bad);background:var(--card);padding:8px 10px;border-radius:6px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}th{background:var(--sel)}
#rep{display:none}
@media print{
 :root{--bg:#fff;--fg:#000;--card:#fff;--bd:#999;--sel:#eee;--mut:#444}
 body{background:#fff;color:#000;font-size:11px}.noprint{display:none!important}#rep{display:block}main{max-width:none;padding:0}
 tr{break-inside:avoid}thead{display:table-header-group}}
</style></head><body><main>
<div class="noprint"><h1>Diario digestivo</h1><div class="tabs" id="tabs"></div><div id="v"></div></div>
<div id="rep"></div>
</main>
<script type="module">
// 1) PEGA AQUÍ la configuración de tu app web de Firebase (ver LEEME.md, paso 5)
const firebaseConfig = {
  apiKey: "AIzaSyAKx8CYfiFFkqgApTxZtGu1a0ZVRiGnNDk",
  authDomain: "mojicones-8d988.firebaseapp.com",
  projectId: "mojicones-8d988",
  storageBucket: "mojicones-8d988.firebasestorage.app",
  messagingSenderId: "926667423090",
  appId: "1:926667423090:web:44bf0482cd2b2b8f1eb1eb"
};
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,addDoc,deleteDoc,doc,setDoc,onSnapshot,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const nowH=()=>{const n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())};
const fr=h=>h<"12:00"?"mañana":h<"18:00"?"mediodía":"noche";
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const A={cur:iso(new Date()),tab:"hoy",draft:{},from:"",to:iso(new Date())};window.A=A;
let U=null,EV=[],DAYS={},err="",offs=[];
const BN={1:"Bolitas duras separadas",2:"Alargada con grumos",3:"Alargada con grietas",4:"Lisa y blanda",5:"Trozos blandos, bordes nítidos",6:"Pastosa, bordes deshechos",7:"Líquida, sin trozos"};
const BR={
1:'<circle cx="10" cy="22" r="5"/><circle cx="22" cy="14" r="4.5"/><circle cx="33" cy="25" r="5"/><circle cx="45" cy="16" r="4.5"/><circle cx="56" cy="26" r="4"/>',
2:'<path d="M5 24c0-8 6-11 12-10 6-3 13-2 18 0 8-3 20-1 21 9 0 8-9 11-17 10-6 3-12 2-18 0-8 2-16-1-16-9z"/>',
3:'<rect x="5" y="13" width="54" height="17" rx="8.5"/><path d="M17 13v7M29 13v9M42 13v7M23 30v-6M36 30v-7M50 30v-6" stroke="var(--card)" stroke-width="1.6" fill="none"/>',
4:'<path d="M5 26c0-9 8-11 16-11h24c10 0 14 4 14 10 0 6-6 7-14 7H20c-9 0-15-1-15-6z"/>',
5:'<ellipse cx="13" cy="22" rx="8" ry="7"/><ellipse cx="30" cy="18" rx="7" ry="6"/><ellipse cx="46" cy="24" rx="9" ry="7"/><ellipse cx="22" cy="31" rx="5" ry="3.5"/>',
6:'<path d="M5 30c-2-7 3-9 7-9 1-6 8-8 12-4 4-5 11-3 12 2 6-3 13 0 12 6 5 0 8 4 4 8-4 3-9 1-12 2-6 2-12 0-17 0-5 2-12 1-18-5z" opacity=".9"/><circle cx="8" cy="12" r="1.6"/><circle cx="56" cy="14" r="1.6"/>',
7:'<path d="M3 31q7-7 13-3t13-3 13 3 13-3 9 3v7H3z"/><circle cx="14" cy="17" r="2.3"/><circle cx="30" cy="12" r="2"/><circle cx="46" cy="16" r="2.4"/><circle cx="55" cy="9" r="1.6"/>'};
const bsvg=b=>'<svg class="s" viewBox="0 0 64 40">'+BR[b]+"</svg>";
const body=z=>{const f=x=>z===x||z==="todo"?"var(--ac)":"none";return '<svg viewBox="0 0 30 40" width="30" height="40"><path d="M5 2h20l2 14c0 8-3 14-6 22H9C6 30 3 24 3 16z" fill="none" stroke="var(--mut)" stroke-width="1.5"/><path d="M6 8h18l.6 8H5.4z" fill="'+f("alta")+'" opacity=".75"/><path d="M6 20h18c-.5 5-2 10-4 15H10C8 30 6.5 25 6 20z" fill="'+f("baja")+'" opacity=".75"/></svg>'};
const LOC={alta:"Parte alta (estómago)",baja:"Parte baja (intestino)",todo:"General"},LOCS={alta:"Alta",baja:"Baja",todo:"General"};
const FR={mañana:"Mañana",mediodía:"Mediodía",noche:"Noche"};
const MEAL={"":"No sé",ayunas:"En ayunas",antes:"Antes de comer",durante:"Durante la comida",despues:"Después de comer"};
const cmp=(a,b)=>a.hora<b.hora?-1:1,evs=d=>EV.filter(e=>e.fecha===d);

onAuthStateChanged(auth,u=>{U=u;offs.forEach(f=>f());offs=[];EV=[];DAYS={};err="";if(u)listen();R()});
function listen(){
 const bad=e=>{err=e.code||"error";R()};
 offs.push(onSnapshot(query(collection(db,"registros"),orderBy("fecha")),s=>{EV=s.docs.map(d=>({id:d.id,...d.data()}));err="";soft()},bad));
 offs.push(onSnapshot(collection(db,"dias"),s=>{DAYS={};s.forEach(d=>DAYS[d.id]=d.data());soft()},bad));
}
function soft(){const a=document.activeElement;if(a&&/TEXTAREA|INPUT|SELECT/.test(a.tagName)&&$("#v").contains(a))return;R()}
function R(){
 $("#tabs").innerHTML=U?[["hoy","Registrar"],["hist","Historial"],["inf","Informe"]].map(([k,l])=>`<button class="${A.tab===k?"on":""}" onclick="A.tab='${k}';R()">${l}</button>`).join(""):"";
 if(!U){$("#v").innerHTML='<div class="card"><p>Inicia sesión con la cuenta de Google autorizada.</p><button class="pri" onclick="login()">Entrar con Google</button></div>';return}
 if(err){$("#v").innerHTML=`<div class="alert">${err==="permission-denied"?"Esta cuenta no tiene permiso. Comprueba que tu correo está en las reglas de Firestore.":"Error: "+esc(err)}</div><p><button onclick="logout()">Cambiar de cuenta</button></p>`;return}
 $("#v").innerHTML=A.tab==="hoy"?vHoy():A.tab==="hist"?vHist():vInf();
}
window.R=R;window.login=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{err=e.code;R()});window.logout=()=>signOut(auth);
const mv=n=>{const d=new Date(A.cur+"T12:00");d.setDate(d.getDate()+n);if(iso(d)>iso(new Date()))return;A.cur=iso(d);A.draft={};R()};window.mv=mv;
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"});
function vHoy(){
 const E=evs(A.cur),st=E.filter(e=>e.t==="s").sort(cmp),pa=E.filter(e=>e.t==="p").sort(cmp),D=DAYS[A.cur]||{},dr=A.draft;
 let h=`<div class="nav"><button onclick="mv(-1)">‹</button><input type="date" value="${A.cur}" max="${iso(new Date())}" onchange="A.cur=this.value||A.cur;A.draft={};R()"><button onclick="mv(1)">›</button></div>`;
 h+=`<div class="card"><h2>Deposiciones hoy: ${st.length}</h2><div class="mut" style="margin-bottom:8px">Toca la que más se parezca. Puedes registrar tantas como haga al día.</div><div class="grid">`+
 [1,2,3,4,5,6,7].map(b=>`<button class="bt ${dr.s&&dr.s.b===b?"sel":""}" onclick="A.draft={s:{b:${b},hora:'${nowH()}'}};R()">${bsvg(b)}<b>${b}</b>${BN[b]}</button>`).join("")+"</div>";
 if(dr.s)h+=`<div class="row"><b>Tipo ${dr.s.b}</b> a las <input type="time" value="${dr.s.hora}" onchange="A.draft.s.hora=this.value"></div><div class="row">`+
 [["urg","Urgencia"],["sangre","Sangre visible"],["moco","Moco"],["noct","De noche (me despertó)"]].map(([k,l])=>`<label><input type="checkbox" ${dr.s[k]?"checked":""} onchange="A.draft.s.${k}=this.checked?1:0">${l}</label>`).join("")+`</div><button class="pri" onclick="saveS()">Guardar deposición</button>`;
 h+=st.map(e=>`<div class="li"><span>${e.hora} · Tipo ${e.b} ${[e.urg&&"urgencia",e.sangre&&"sangre",e.moco&&"moco",e.noct&&"noche"].filter(Boolean).map(x=>`<span class="chip">${x}</span>`).join("")}</span><button onclick="del('${e.id}')">✕</button></div>`).join("")+"</div>";
 h+=`<div class="card"><h2>Dolor de barriga</h2><div class="grid">`+["alta","baja","todo"].map(z=>`<button class="bt ${dr.p&&dr.p.zona===z?"sel":""}" onclick="A.draft={p:{zona:'${z}',n:4,hora:'${nowH()}',franja:fr('${nowH()}'),meal:''}};R()">${body(z)}${LOC[z]}</button>`).join("")+
 `<button class="bt ${D.sinDolor?"sel":""}" onclick="dia({sinDolor:${!D.sinDolor}})"><span style="font-size:28px">🙂</span>Sin dolor hoy</button></div>`;
 if(dr.p){const p=dr.p;h+=`<div class="row"><b>${LOC[p.zona]}</b> a las <input type="time" value="${p.hora}" onchange="A.draft.p.hora=this.value;A.draft.p.franja=fr(this.value);R()"></div>
 <div class="row"><label>Momento del día: <select onchange="A.draft.p.franja=this.value">${Object.entries(FR).map(([k,v])=>`<option value="${k}" ${p.franja===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
 <div class="row"><label>Intensidad: <b id="nv">${p.n}</b>/10<input type="range" min="1" max="10" value="${p.n}" oninput="A.draft.p.n=+this.value;document.getElementById('nv').textContent=this.value"></label></div>
 <div class="row"><label>Relación con la comida: <select onchange="A.draft.p.meal=this.value">${Object.entries(MEAL).map(([k,v])=>`<option value="${k}" ${p.meal===k?"selected":""}>${v}</option>`).join("")}</select></label></div><button class="pri" onclick="saveP()">Guardar dolor</button>`}
 h+=pa.map(e=>`<div class="li"><span>${e.hora} · ${LOC[e.zona]} · ${e.n}/10 · ${FR[e.franja]||""} <span class="mut">${MEAL[e.meal||""]}</span></span><button onclick="del('${e.id}')">✕</button></div>`).join("")+"</div>";
 h+=`<div class="card"><h2>Del día</h2><div class="row">`+[["med","Protector de estómago tomado"],["fiebre","Fiebre"],["vomitos","Vómitos"]].map(([k,l])=>`<label><input type="checkbox" ${D[k]?"checked":""} onchange="dia({${k}:this.checked})">${l}</label>`).join("")+
 `</div><div class="mut">Notas (comidas, estrés, sueño, otros síntomas…)</div><textarea rows="3" onchange="dia({nota:this.value})">${esc(D.nota)}</textarea></div>
 <p class="mut">Sesión: ${esc(U.email)} · <a href="#" onclick="logout();return false">cerrar sesión</a></p>`;
 return h}
const dia=o=>{setDoc(doc(db,"dias",A.cur),o,{merge:true}).catch(e=>{err=e.code;R()})};window.dia=dia;window.fr=fr;
window.saveS=()=>{const s=A.draft.s;addDoc(collection(db,"registros"),{t:"s",fecha:A.cur,...s}).catch(e=>{err=e.code;R()});A.draft={};R()};
window.saveP=()=>{const p=A.draft.p;addDoc(collection(db,"registros"),{t:"p",fecha:A.cur,...p}).catch(e=>{err=e.code;R()});if(DAYS[A.cur]&&DAYS[A.cur].sinDolor)dia({sinDolor:false});A.draft={};R()};
window.del=id=>{deleteDoc(doc(db,"registros",id))};
function dates(){return [...new Set([...EV.map(e=>e.fecha),...Object.keys(DAYS).filter(d=>Object.values(DAYS[d]).some(Boolean))])].sort()}
function vHist(){const ds=dates().reverse();if(!ds.length)return '<div class="card mut">Aún no hay registros.</div>';
 return ds.map(d=>{const E=evs(d),s=E.filter(e=>e.t==="s").sort(cmp),p=E.filter(e=>e.t==="p").sort(cmp),D=DAYS[d]||{};
 return `<div class="card" onclick="A.cur='${d}';A.tab='hoy';A.draft={};R()" style="cursor:pointer"><b>${fmt(d)}</b> · ${s.length} deposiciones ${s.map(e=>`<span class="chip">${e.b}</span>`).join("")}<br>${p.length?p.map(e=>`<span class="chip">${LOCS[e.zona]} ${e.n}/10 ${FR[e.franja]||""}</span>`).join(""):D.sinDolor?"Sin dolor":'<span class="mut">dolor sin registrar</span>'}${D.nota?`<div class="mut">${esc(D.nota)}</div>`:""}</div>`}).join("")}
function rows(){
 const ds=dates().filter(d=>(!A.from||d>=A.from)&&(!A.to||d<=A.to));
 return ds.map(d=>{const E=evs(d),s=E.filter(e=>e.t==="s").sort(cmp),p=E.filter(e=>e.t==="p").sort(cmp),D=DAYS[d]||{};
  const ex=[D.med&&"protector tomado",D.fiebre&&"fiebre",D.vomitos&&"vómitos",...s.filter(e=>e.sangre).map(e=>"sangre "+e.hora),...s.filter(e=>e.noct).map(e=>"deposición nocturna "+e.hora)].filter(Boolean);
  return{d,n:s.length,b:s.map(e=>`T${e.b} (${e.hora})`).join(", ")||"–",bs:s,ps:p,
   dolor:p.length?p.map(e=>`${LOCS[e.zona]} ${e.n}/10, ${FR[e.franja]||""}${e.meal?" ("+MEAL[e.meal].toLowerCase()+")":""}`).join("; "):D.sinDolor?"Sin dolor":"–",
   nota:[D.nota,ex.length?"["+ex.join(", ")+"]":""].filter(Boolean).join(" ")}})}
function reportHTML(){
 const r=rows(),tot=r.reduce((a,x)=>a+x.n,0),all=r.flatMap(x=>x.bs),cnt=i=>all.filter(e=>e.b===i).length,pd=r.filter(x=>x.ps.length).length,pe=r.flatMap(x=>x.ps);
 return `<h1>Informe de seguimiento digestivo</h1><p>Periodo: ${A.from||(r[0]&&r[0].d)||"–"} a ${A.to||"–"} · Generado: ${iso(new Date())} · Días con registro: ${r.length}</p>
 <p><b>Resumen:</b> ${tot} deposiciones (media ${r.length?(tot/r.length).toFixed(1):0}/día). Bristol: ${[1,2,3,4,5,6,7].map(i=>`T${i}=${cnt(i)}`).join(", ")}. Días con dolor: ${pd}/${r.length}; episodios ${pe.length} (alta ${pe.filter(e=>e.zona==="alta").length}, baja ${pe.filter(e=>e.zona==="baja").length}, general ${pe.filter(e=>e.zona==="todo").length}; mañana ${pe.filter(e=>e.franja==="mañana").length}, mediodía ${pe.filter(e=>e.franja==="mediodía").length}, noche ${pe.filter(e=>e.franja==="noche").length}).</p>
 <table><thead><tr><th>Fecha</th><th>Nº deposiciones</th><th>Escala Bristol (hora)</th><th>Dolor (zona, intensidad, momento)</th><th>Notas</th></tr></thead><tbody>`+
 r.map(x=>`<tr><td>${x.d}</td><td>${x.n}</td><td>${x.b}</td><td>${esc(x.dolor)}</td><td>${esc(x.nota)}</td></tr>`).join("")+"</tbody></table>"}
function vInf(){const ds=dates();if(!A.from&&ds.length)A.from=ds[0];
 return `<div class="card"><div class="row"><label>Desde <input type="date" value="${A.from}" onchange="A.from=this.value;R()"></label><label>Hasta <input type="date" value="${A.to}" onchange="A.to=this.value;R()"></label></div>
 <button class="pri" onclick="window.print()">Guardar informe en PDF</button><div class="mut">En el diálogo de impresión elige “Guardar como PDF”.</div></div>
 <div class="card" style="overflow-x:auto">${reportHTML()}</div>
 <div class="alert"><b>Consulta sin esperar a la llamada</b> si hay sangre en las heces, diarrea nocturna que lo despierta, fiebre, vómitos repetidos, pérdida de peso o dolor intenso.</div>`}
window.addEventListener("beforeprint",()=>{$("#rep").innerHTML=reportHTML()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
R();
</script></body></html>
